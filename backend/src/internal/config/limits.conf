# Limits and timings of the backend, baked into the binary when the image is built. A real environment variable of the
# same name still overrides a value here at run time.

# Seconds between fetches of one competition from the data source (each wait is spread by +-25%)
LIVE_RESULTS_INTERVAL=1
# Competitions followed at once
MAX_COMPETITIONS=25
# Viewers on one competition at once
MAX_CLIENTS_PER_ROOM=1000
# Viewers over all competitions at once
MAX_CLIENTS=2000
# Viewer connections accepted in any 30 days (a rolling window kept in memory, so a restart empties it); sized for the
# outbound bandwidth of the hosting plan
MAX_CLIENTS_30_DAYS=50000
# Connections one client address may hold at once
MAX_CLIENTS_PER_IP=10
# Connection attempts per minute one client address may make on average, and how many it may make back to back
CONNECTS_PER_MINUTE=30
CONNECT_BURST=10
# Seconds an empty competition keeps being fetched before it is closed
IDLE_GRACE_SECONDS=30
# Hours after a competition's start that its data is served (0: until the day after it ends)
DATA_RETENTION_HOURS=12
# Seconds the list of competitions is cached
CATALOG_TTL_SECONDS=900
