# Template: FRONTEND_CSP_CONNECT_SRC and FRONTEND_CSP_FRAME_ANCESTORS are filled in when the container starts.
# The scripts and styles come from the page's own origin. The API and websocket are reached through connect-src: the page's
# own origin by default, plus the backend's origin when FRONTEND_BACKEND_URL points elsewhere. Component styles are injected at run
# time, hence 'unsafe-inline' for styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src ${FRONTEND_CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors ${FRONTEND_CSP_FRAME_ANCESTORS}; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex, noai, noimageai" always;
