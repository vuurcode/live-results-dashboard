# Weekly, major versions only, one grouped pull request per ecosystem and directory.
# (Security updates are separate from these version updates and are not limited by the ignore rules.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Angular's compiler pins its supported TypeScript range; upgrade it together with Angular.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-frontend-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: gomod
    directory: /src/backend/src
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      gomod-backend-src-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: gomod
    directory: /src/mockserver
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      gomod-mockserver-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: docker
    directory: /prod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Angular supports only the even-numbered (long-term support) Node releases; the odd ones are short-lived.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x", "31.x"]
    groups:
      docker-prod-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: docker
    directory: /src/mockserver
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docker-mockserver-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      github-actions-root-majors:
        patterns: ["*"]
        update-types: ["major"]
