name: Deploy

# Started by hand. Rolls the existing DigitalOcean app out again, which pulls the image that the Publish workflow
# pushed to the GitHub Container Registry. The app, its settings and its image are configured on DigitalOcean;
# the secrets DIGITALOCEAN_ACCESS_TOKEN and DIGITALOCEAN_APP_NAME name the account access and the app.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: ${{ secrets.DIGITALOCEAN_APP_NAME }}
          print_build_logs: true
          print_deploy_logs: true
