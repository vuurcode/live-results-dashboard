services:
  # Everything for development in one container, including Claude Code:
  #   docker compose --profile dev up -d --build
  #   docker exec -it dev claude
  # http://localhost:4200 (frontend, hot reload), http://localhost:5000 (backend)
  dev:
    profiles: [dev]
    container_name: dev
    build:
      context: .
      dockerfile: Containerfile
      target: dev
    ports:
      - "4200:4200"
      - "5000:5000"
    extra_hosts:
      - "backend:127.0.0.1"
      - "mockserver:127.0.0.1"
    environment:
      # The mockserver serves every match under data/ (one folder per match, replay starts on
      # first request). Which match the frontend shows: open http://localhost:4200/?competitionId=<folder>
      # or set the default for pages without it: COMPETITION_ID=2026-03-01 docker compose --profile dev up -d
      DATA_SAMPLE_DIRECTORY: data
      DATA_SAMPLE_INTERVAL: ${DATA_SAMPLE_INTERVAL:-3}
      DATA_SOURCE_URL: http://localhost:8080/api/data
      DATA_SOURCE_INTERVAL: 1
      DEFAULT_COMPETITION_ID: ${COMPETITION_ID:-dummy}
    volumes:
      - .:/app
      - /app/frontend/node_modules          # keep host node_modules out; installed in-container
      # Hide the tunnel files from Claude (empty in-memory dir over the real one)
      - type: tmpfs
        target: /app/tunnel
      # git hooks/config and Claude's deny rules stay read-only: a hook or
      # core.fsmonitor/hooksPath/sshCommand set from here would run on the host
      - ./.git/hooks:/app/.git/hooks:ro
      - ./.git/config:/app/.git/config:ro
      - ./.claude/settings.json:/app/.claude/settings.json:ro
      # Before first run: touch container-data/claude.json
      - ./container-data/claude:/root/.claude
      - ./container-data/claude.json:/root/.claude.json

  # Production, built without Claude or dev tooling:
  #   DATA_SOURCE_URL=https://... docker compose --profile prod up -d --build
  # http://localhost:8888
  backend:
    profiles: [prod]
    container_name: backend
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      # no ':?' check here: compose interpolates every service, also for profiles that are not started.
      # The backend itself refuses to start when this is empty.
      DATA_SOURCE_URL: ${DATA_SOURCE_URL:-}
      DATA_SOURCE_INTERVAL: ${DATA_SOURCE_INTERVAL:-1}
    restart: unless-stopped
    networks:
      - dashboard-net

  frontend:
    profiles: [prod]
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "8888:80"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dashboard-net

  # Opt-in: TUNNEL_DIR=/path/outside/project docker compose --profile prod --profile tunnel up -d
  # TUNNEL_DIR holds config.yml, cert.pem and tunnel-credentials.json; keep it outside
  # the project so the dev container (and Claude) can never see it.
#  tunnel:
#    profiles: [tunnel]
#    image: cloudflare/cloudflared:latest
#    container_name: tunnel
#    restart: unless-stopped
#    command: tunnel run
#    volumes:
#      - ${TUNNEL_DIR:?set TUNNEL_DIR to the directory holding the tunnel files}/config.yml:/etc/cloudflared/config.yml:ro
#      - ${TUNNEL_DIR}/cert.pem:/etc/cloudflared/cert.pem:ro
#      - ${TUNNEL_DIR}/tunnel-credentials.json:/etc/cloudflared/tunnel-credentials.json:ro
#    depends_on:
#      - frontend
#      - backend
#    networks:
#      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
