services:
  # Everything for development in one container, including Claude Code:
  #   docker compose --profile dev up -d --build
  #   docker exec -it dev claude
  # http://localhost:4200 (frontend, hot reload), http://localhost:5000 (backend)
  dev:
    profiles: [dev]
    container_name: dev
    build:
      context: .
      dockerfile: Containerfile
      target: dev
    ports:
      - "4200:4200"
      - "5000:5000"
    extra_hosts:
      - "backend:127.0.0.1"
      - "mockserver:127.0.0.1"
    environment:
      # The mockserver serves every competition under data/ (one folder per competition, replay starts on
      # first request). Which competition the frontend shows: open http://localhost:4200/?competitionId=<folder>
      # or set the default for pages without it: BACKEND_DEFAULT_COMPETITION_ID=2026-03-01 docker compose --profile dev up -d
      MOCKSERVER_DATA_SAMPLE_DIRECTORY: data
      MOCKSERVER_DATA_SAMPLE_INTERVAL: ${MOCKSERVER_DATA_SAMPLE_INTERVAL:-3}
      # seconds a finished replay is held before it restarts from the start; 0 never
      MOCKSERVER_DATA_EXPIRE_AFTER: ${MOCKSERVER_DATA_EXPIRE_AFTER:-300}
      # also serve the generated matches (mock-match-1..3) next to the recordings
      MOCKSERVER_DATA_GENERATE: ${MOCKSERVER_DATA_GENERATE:-true}
      BACKEND_LIVE_RESULTS_BASE_URL: http://localhost:8080
      BACKEND_LIVE_RESULTS_INTERVAL_NOT_STARTED: 1
      BACKEND_LIVE_RESULTS_INTERVAL_MASS_START: 1
      BACKEND_LIVE_RESULTS_INTERVAL_DISTANCE: 1
      BACKEND_DEFAULT_COMPETITION_ID: ${BACKEND_DEFAULT_COMPETITION_ID:-dummy}
    volumes:
      - .:/app
      - /app/src/frontend/node_modules          # keep host node_modules out; installed in-container
      # git hooks/config and Claude's deny rules stay read-only: a hook or
      # core.fsmonitor/hooksPath/sshCommand set from here would run on the host
      - ./.git/hooks:/app/.git/hooks:ro
      - ./.git/config:/app/.git/config:ro
      - ./.claude/settings.json:/app/.claude/settings.json:ro
      # Before first run: touch container-data/claude.json
      - ./container-data/claude:/root/.claude
      - ./container-data/claude.json:/root/.claude.json

  # Production: frontend (nginx) and backend in one container, built without Claude or dev tooling:
  # Optional settings come from .env.prod (shared) and .env.prod.local (gitignored, wins):
  #   docker compose --profile prod up -d --build
  # http://localhost:8888 (nginx serves the page and proxies /api, /ws and /healthcheck to the backend inside)
  app:
    profiles: [prod]
    container_name: app
    build:
      context: .
      dockerfile: prod/Containerfile
    env_file:
      # Both optional; the image carries the defaults. Later files win.
      - path: .env.prod
        required: false
      # Local settings such as the real source URLs; gitignored
      - path: .env.prod.local
        required: false
    ports:
      - "${COMPOSE_APP_PORT:-8888}:8080"
    restart: unless-stopped
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
